version: "2"
run:
  tests: true
linters:
  enable:
    - misspell
    - revive
    - unconvert
    # Cognitive complexity & ballooning
    - gocognit
    - funlen
    # Dead code & unused
    - unused
    - unparam
    - wastedassign
    # Duplication
    - dupl
    # Anti-patterns, bugs & modern Go
    - gocritic
    - nilerr
    - errcheck
    - copyloopvar
  settings:
    govet:
      enable-all: false
    gocognit:
      min-complexity: 45
    funlen:
      lines: 200
      statements: 100
      ignore-comments: true
    dupl:
      threshold: 100
    gocritic:
      disabled-checks:
        - ifElseChain
        - appendAssign
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - untracked
      - third_party$
      - builtin$
      - examples$
      - internal/storage/postgres/.*\.sql\.go$
    rules:
      - path: '(.+)_test\.go'
        linters:
          - gocognit
          - funlen
          - dupl
          - wastedassign
          - copyloopvar
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - untracked
      - third_party$
      - builtin$
      - examples$
